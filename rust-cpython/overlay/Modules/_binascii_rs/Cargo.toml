[package]
name = "_binascii_rs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "PSF-2.0"

[dependencies]
base64 = { version = "=0.23.1", default-features = false } # MIT OR Apache-2.0
data-encoding = { version = "=2.9.0", default-features = false } # MIT
crc32fast = { version = "=1.5.2", default-features = false } # MIT OR Apache-2.0

[build-dependencies]
cpython-build-helper = { path = "../cpython-build-helper" }

[lib]
name = "_binascii_rs"
crate-type = ["cdylib", "rlib"]
