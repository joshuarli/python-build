[package]
name = "_email_rs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
cpython-binding = { path = "../cpython-binding" }
mail-parser = { version = "=0.11.9", default-features = false }

[build-dependencies]
cpython-build-helper = { path = "../cpython-build-helper" }

[lib]
name = "_email_rs"
crate-type = ["cdylib", "rlib"]
