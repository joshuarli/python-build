[package]
name = "_struct_rs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[features]
static-module = []

[dependencies]
byteorder = { version = "=1.5.0", default-features = false }

[build-dependencies]
cpython-build-helper = { path = "../cpython-build-helper" }

[lib]
name = "_struct_rs"
crate-type = ["cdylib", "rlib"]
