[package]
name = "_pickle_rs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "PSF-2.0"

[dependencies]
cpython-sys = { path = "../cpython-sys" }
serde = "1.0"
serde-pickle = "1.2.0"

[build-dependencies]
cpython-build-helper = { path = "../cpython-build-helper" }

[lib]
name = "_pickle_rs"
crate-type = ["cdylib", "rlib"]
