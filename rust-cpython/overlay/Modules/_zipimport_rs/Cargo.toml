[package]
name = "_zipimport_rs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
cpython-binding = { path = "../cpython-binding" }
cpython-deflate = { path = "../cpython-deflate" }

[build-dependencies]
cpython-build-helper = { path = "../cpython-build-helper" }

[lib]
name = "_zipimport_rs"
crate-type = ["cdylib", "rlib"]
