[package]
name = "_shlex_rs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
cpython-binding = { path = "../cpython-binding", features = ["abort-on-panic"] }

[build-dependencies]
cpython-build-helper = { path = "../cpython-build-helper" }

[lib]
name = "_shlex_rs"
crate-type = ["cdylib", "rlib"]
