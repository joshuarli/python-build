[package]
name = "cpython-deflate"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "PSF-2.0"

[dependencies]
cpython-binding = { path = "../cpython-binding" }
libz-rs-sys = { version = "=0.6.7", default-features = false, features = ["std", "rust-allocator"] }

[lib]
name = "cpython_deflate"
crate-type = ["rlib"]
