[package]
name = "_marshal_rs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"

[features]
static-module = []

[dependencies]
cpython-sys = { path = "../cpython-sys" }

[build-dependencies]
cpython-build-helper = { path = "../cpython-build-helper" }

[lib]
name = "_marshal_rs"
crate-type = ["cdylib", "rlib"]
