[package]
name = "_random_rs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[features]
default = ["freestanding"]
freestanding = ["cpython-binding/abort-on-panic"]

[dependencies]
cpython-binding = { path = "../cpython-binding" }

[build-dependencies]
cpython-build-helper = { path = "../cpython-build-helper" }

[lib]
name = "_random_rs"
crate-type = ["cdylib", "rlib"]
