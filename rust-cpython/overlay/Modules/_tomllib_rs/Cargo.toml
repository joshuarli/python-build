[package]
name = "_tomllib_rs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
cpython-sys = { path = "../cpython-sys" }
toml_datetime = "=1.1.1"
toml_parser = "=1.1.3"

[build-dependencies]
cpython-build-helper = { path = "../cpython-build-helper" }

[lib]
name = "_tomllib_rs"
crate-type = ["cdylib", "rlib"]
