[package]
name = "hashlib-graviola"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "_hashlib_graviola"
crate-type = ["cdylib"]

[dependencies]
blake2 = { version = "=0.11.0", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
md-5 = { version = "=0.11.0", default-features = false }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
pyo3-ffi = { version = "=0.27.2", features = ["abi3-py314", "extension-module"] }
ripemd = { version = "=0.2.0", default-features = false }
scrypt = { version = "=0.12.0", default-features = false }
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
sha3 = { version = "=0.12.0", default-features = false }
sm3 = { version = "=0.5.0", default-features = false }

[build-dependencies]
pyo3-build-config = "=0.27.2"
