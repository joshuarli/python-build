name: nix-prototype

on:
  push:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "tests/test_nix_build_image.py"
      - ".github/workflows/nix-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  eval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
      - name: Evaluate both native architecture contexts
        run: |
          set -eu
          for arch in amd64 arm64; do
            for stage in base rtls; do
              nix eval --raw --no-update-lock-file ".#packages.x86_64-linux.${stage}-${arch}.drvPath" >/dev/null
            done
          done
      - name: Test Nix input and cache contracts
        run: python3 -m unittest tests.test_nix_build_image
