name: build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release/build tag. Empty defaults to today's UTC date."
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.15.1"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15.1"

      - name: Resolve and validate release tag
        id: resolve
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3.15 .github/scripts/resolve_release.py

      - name: Run fast controller tests
        run: python3.15 -m unittest discover -s tests

  build-macos:
    runs-on: xcode-27
    needs: [prepare]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15.1"

      - name: Cache verified source blobs (actions/cache v6.1.0)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/objects
          key: sources-${{ hashFiles('sources.lock.json') }}
          restore-keys: sources-

      - name: Cache selectively extracted LLVM toolchain (actions/cache v6.1.0)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/llvm
          key: llvm-${{ hashFiles('bootstrap.lock.json') }}
          restore-keys: llvm-

      - name: Install required Homebrew tools
        run: |
          brew update
          for formula in make pkgconf; do
            brew list "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
          brew upgrade make pkgconf

      - name: Fetch
        run: python3.15 build.py fetch --target aarch64-apple-darwin

      - name: Doctor
        run: python3.15 build.py doctor

      - name: Build
        run: python3.15 build.py build --target aarch64-apple-darwin

      - name: Package and validate
        run: python3.15 build.py package --target aarch64-apple-darwin

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-aarch64-apple-darwin
          path: dist/aarch64-apple-darwin

  build-linux:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-24.04
            platform: linux/amd64
            triple: x86_64-unknown-linux-musl
            image: pyrelease:amd64
            container: package-amd64
            cache-scope: sealed-linux-amd64
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            triple: aarch64-unknown-linux-musl
            image: pyrelease:arm64
            container: package-arm64
            cache-scope: sealed-linux-arm64
    runs-on: ${{ matrix.runs-on }}
    needs: [prepare]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15.1"

      - name: Cache verified source blobs (actions/cache v6.1.0)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/objects
          key: sources-${{ hashFiles('sources.lock.json') }}
          restore-keys: sources-

      - name: Fetch sources
        run: python3.15 build.py fetch --target "${{ matrix.triple }}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Sealed build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: sealed
          tags: ${{ matrix.image }}
          load: true
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      - name: Package and validate in the sealed image
        env:
          GITHUB_SHA: ${{ github.sha }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --platform "${{ matrix.platform }}" --network none \
            --name "${{ matrix.container }}" \
            --env GITHUB_SHA "$IMAGE" \
            python3.15 build/package.py
          mkdir -p dist
          docker cp "${{ matrix.container }}:/work/dist/." ./dist/
          docker rm "${{ matrix.container }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-${{ matrix.triple }}
          path: dist/${{ matrix.triple }}

  assemble:
    runs-on: ubuntu-24.04
    needs: [prepare, build-macos, build-linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist-aarch64-apple-darwin
          path: dist/aarch64-apple-darwin

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist/x86_64-unknown-linux-musl

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist-aarch64-unknown-linux-musl
          path: dist/aarch64-unknown-linux-musl

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15.1"

      - name: Assemble and validate release assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3.15 build/uvmirror.py --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dist dist --out release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets
          path: release

  smoke-macos:
    runs-on: xcode-27
    needs: [prepare, assemble]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: release

      - name: Install uv 0.13.4 for Apple Silicon
        env:
          UV_VERSION: "0.13.4"
          UV_ARCHIVE: uv-aarch64-apple-darwin.tar.gz
          UV_SHA256: e0b1d4743ce64c55d9f0f4a444afa6b81125680070ee04e853fcd0f6c1ebf8f1
          UV_TARGET: uv-aarch64-apple-darwin
        run: |
          set -eu
          archive="$RUNNER_TEMP/$UV_ARCHIVE"
          curl --fail --location --output "$archive" \
            "https://releases.astral.sh/github/uv/releases/download/$UV_VERSION/$UV_ARCHIVE"
          printf '%s  %s\n' "$UV_SHA256" "$archive" | shasum -a 256 --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" "$UV_TARGET/uv"
          mkdir -p "$RUNNER_TEMP/uv-bin"
          install -m 0755 "$RUNNER_TEMP/$UV_TARGET/uv" "$RUNNER_TEMP/uv-bin/uv"
          "$RUNNER_TEMP/uv-bin/uv" --version | grep -Fx "uv $UV_VERSION"

      - name: Smoke exact assembled bytes through uv
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          UV_PYTHON_INSTALL_MIRROR: file://${{ github.workspace }}/mirror
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-smoke/python
          UV_CACHE_DIR: ${{ runner.temp }}/uv-smoke/cache
          UV_PYTHON_CACHE_DIR: ${{ runner.temp }}/uv-smoke/python-cache
          EXPECTED_PLATFORM: darwin
          EXPECTED_MACHINE: arm64
        run: |
          set -eu
          rm -rf "$RUNNER_TEMP/uv-smoke"
          mkdir -p "$UV_PYTHON_INSTALL_DIR" "$UV_CACHE_DIR" "$UV_PYTHON_CACHE_DIR"
          mkdir -p "mirror/$RELEASE_TAG"
          cp release/*.tar.gz "mirror/$RELEASE_TAG/"
          (cd release && shasum -a 256 --check SHA256SUMS)
          key="cpython-${PYTHON_VERSION}-darwin-aarch64-none"
          "$RUNNER_TEMP/uv-bin/uv" python install "$key" \
            --python-downloads-json-url "$GITHUB_WORKSPACE/release/smoke-metadata.json"
          python_path="$("$RUNNER_TEMP/uv-bin/uv" python find --system "$key")"
          EXPECTED_PLATFORM=darwin EXPECTED_MACHINE=arm64 \
            "$python_path" .github/scripts/verify_uv_python.py "$UV_PYTHON_INSTALL_DIR"
          "$python_path" .github/scripts/toy.py

  smoke-linux:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-24.04
            platform: linux/amd64
            uv_target: x86_64-unknown-linux-musl
            uv_key_suffix: linux-x86_64-musl
            expected_machine: x86_64
            uv_sha256: 28d4385f9f9d1d1c7654d85b3855e0e2615b2f6cc13136a2edff858bbdc16ff1
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            uv_target: aarch64-unknown-linux-musl
            uv_key_suffix: linux-aarch64-musl
            expected_machine: aarch64
            uv_sha256: 253a17cadcb659ae77a0fe3b9a2f1c14297528d480c421899e61e64d64f24e8f
    runs-on: ${{ matrix.runs-on }}
    needs: [prepare, assemble]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: release

      - name: Smoke exact assembled bytes through uv in musl
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          UV_VERSION: "0.13.4"
          UV_TARGET: ${{ matrix.uv_target }}
          UV_KEY_SUFFIX: ${{ matrix.uv_key_suffix }}
          UV_SHA256: ${{ matrix.uv_sha256 }}
          EXPECTED_MACHINE: ${{ matrix.expected_machine }}
          UV_PYTHON_INSTALL_DIR: /tmp/uv-smoke/python
          UV_CACHE_DIR: /tmp/uv-smoke/cache
          UV_PYTHON_CACHE_DIR: /tmp/uv-smoke/python-cache
        run: |
          set -eu
          mkdir -p "mirror/$RELEASE_TAG"
          cp release/*.tar.gz "mirror/$RELEASE_TAG/"
          (cd release && sha256sum --check SHA256SUMS)
          base_image="$(python3 -c 'import json; print(json.load(open("bootstrap.lock.json"))["base_image"])')"
          docker run --platform "${{ matrix.platform }}" --rm \
            --volume "$PWD/release:/release:ro" \
            --volume "$PWD/mirror:/mirror:ro" \
            --volume "$PWD/.github/scripts:/scripts:ro" \
            --env RELEASE_TAG \
            --env PYTHON_VERSION \
            --env UV_VERSION \
            --env UV_TARGET \
            --env UV_KEY_SUFFIX \
            --env UV_SHA256 \
            --env EXPECTED_MACHINE \
            --env UV_PYTHON_INSTALL_DIR \
            --env UV_CACHE_DIR \
            --env UV_PYTHON_CACHE_DIR \
            --env EXPECTED_PLATFORM=linux \
            "$base_image" sh -ec '
              apk add --no-cache ca-certificates curl tar
              archive="uv-$UV_TARGET.tar.gz"
              curl --fail --location --output "/tmp/$archive" \
                "https://releases.astral.sh/github/uv/releases/download/$UV_VERSION/$archive"
              printf "%s  %s\n" "$UV_SHA256" "/tmp/$archive" | sha256sum --check -
              tar -xzf "/tmp/$archive" -C /tmp "$UV_TARGET/uv"
              install -m 0755 "/tmp/$UV_TARGET/uv" /usr/local/bin/uv
              uv --version | grep -Fx "uv $UV_VERSION"
              rm -rf /tmp/uv-smoke
              mkdir -p "$UV_PYTHON_INSTALL_DIR" "$UV_CACHE_DIR" "$UV_PYTHON_CACHE_DIR"
              (cd /release && sha256sum --check SHA256SUMS)
              export UV_PYTHON_INSTALL_MIRROR=file:///mirror
              key="cpython-${PYTHON_VERSION}-${UV_KEY_SUFFIX}"
              uv python install "$key" --python-downloads-json-url /release/smoke-metadata.json
              python_path="$(uv python find --system "$key")"
              "$python_path" /scripts/verify_uv_python.py "$UV_PYTHON_INSTALL_DIR"
              "$python_path" /scripts/toy.py
            '

  publish:
    runs-on: ubuntu-24.04
    needs: [prepare, assemble, smoke-macos, smoke-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: release

      - name: Verify assembled release hashes
        run: (cd release && sha256sum --check SHA256SUMS)

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          CPython $PYTHON_VERSION standalone distributions for build tag $RELEASE_TAG.

          Assets include archive hashes and installation metadata for `uv python install`.
          Source revision: $GITHUB_SHA
          EOF
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease \
            --title "cpython-$PYTHON_VERSION+$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" release/*
