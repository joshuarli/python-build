[project]
name = "python-build"
version = "0.0.0"
requires-python = ">=3.15"

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "ty==0.0.91",
    "uv==0.13.5",
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
package = false

[tool.ruff]
target-version = "py315"
extend-exclude = ["rust-cpython/overlay", "benchmarks/workloads/fixtures"]

[tool.ty.environment]
python-version = "3.15"

[[tool.uv.index]]
url = "https://pypi.17166969.xyz/current/simple/"
default = true
