[project]
name = "python-build"
version = "0.0.0"
requires-python = ">=3.15"

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "ty==0.0.91",
    "uv==0.13.5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py315"
extend-exclude = ["rust-cpython/overlay", "benchmarks/workloads/fixtures"]

[tool.ty.environment]
python-version = "3.15"
